name: Build macOS (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Read Flutter version
        id: flutter
        run: echo "version=$(tr -d '[:space:]' < .github/flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      - name: Generate code
        run: |
          flutter --version
          xcodebuild -version
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze and test
        run: |
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
          flutter test --no-pub --reporter expanded

      - name: Build macOS
        run: |
          bash scripts/macos_nosign.sh
          flutter build macos --release --no-pub

      - name: Package local verification build
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          APP="build/macos/Build/Products/Release/Anx Reader.app"
          # 验收包沿用现有非商店包的数据目录；不引入商店版沙盒迁移。
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          mkdir -p build/macos-artifact
          ditto -c -k --keepParent "$APP" build/macos-artifact/AnxReader-macos.zip
          printf '%s\n' "$BUILD_SHA" > build/macos-artifact/commit.txt
          cd build/macos-artifact
          shasum -a 256 AnxReader-macos.zip > SHA256SUMS

      - name: Upload build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-verification-${{ github.sha }}
          path: build/macos-artifact/
          if-no-files-found: error
          retention-days: 7
